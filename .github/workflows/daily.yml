name: Daily Huangli Push

on:
  schedule:
    # UTC 23:30 = 北京时间 07:30
    - cron: "30 23 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cache design fonts
        id: cache-fonts
        uses: actions/cache@v4
        with:
          path: fonts
          key: source-han-sans-cn-subset-v1

      - name: Download Source Han Sans SC (CI fallback)
        if: steps.cache-fonts.outputs.cache-hit != 'true'
        run: |
          mkdir -p fonts
          curl -fsSL -o fonts/SourceHanSansSC-Regular.otf \
            "https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-sans@release/SubsetOTF/CN/SourceHanSansCN-Regular.otf"
          curl -fsSL -o fonts/SourceHanSansSC-Bold.otf \
            "https://cdn.jsdelivr.net/gh/adobe-fonts/source-han-sans@release/SubsetOTF/CN/SourceHanSansCN-Bold.otf"
          ls -lh fonts/

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and push card
        env:
          WECOM_HOOK: ${{ secrets.WECOM_HOOK }}
          # CI 无系统苹方；使用随 workflow 缓存的思源黑体 CN（开源，视觉接近苹方）
          FONT_REGULAR: ${{ github.workspace }}/fonts/SourceHanSansSC-Regular.otf
          FONT_BOLD: ${{ github.workspace }}/fonts/SourceHanSansSC-Bold.otf
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ vars.HIGHLIGHT_KEYS }}" ]; then
            export HIGHLIGHT_KEYS="${{ vars.HIGHLIGHT_KEYS }}"
          fi
          python huangli.py

      - name: Upload card artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: huangli-card
          path: card.png
          if-no-files-found: warn
