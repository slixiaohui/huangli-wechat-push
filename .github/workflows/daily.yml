name: Daily Huangli Push

on:
  schedule:
    # UTC 23:30 = 北京时间 07:30
    - cron: "30 23 * * *"
  workflow_dispatch:

jobs:
  push:
    # macOS runner 自带苹方简体（PingFang SC），与设计稿一致
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and push card
        env:
          WECOM_HOOK: ${{ secrets.WECOM_HOOK }}
          PYTHONUNBUFFERED: "1"
        run: |
          # 探测苹方路径（不同 macOS 镜像路径可能不同）
          PF=$(find /System/Library/Fonts /Library/Fonts -iname 'PingFang*.ttc' 2>/dev/null | head -1)
          if [ -z "$PF" ]; then
            PF=$(mdfind -name 'PingFang.ttc' 2>/dev/null | head -1)
          fi
          if [ -n "$PF" ]; then
            export FONT_REGULAR="$PF"
            export FONT_BOLD="$PF"
            echo "Using PingFang at $PF"
          else
            echo "PingFang not found; listing font dirs:"
            ls /System/Library/Fonts | head -100
            find /System/Library/Fonts -iname '*fang*' -o -iname '*hei*' 2>/dev/null | head -40
          fi
          # 仅当仓库 Variables 配置了 HIGHLIGHT_KEYS 时才注入，避免空字符串覆盖默认「交易」
          if [ -n "${{ vars.HIGHLIGHT_KEYS }}" ]; then
            export HIGHLIGHT_KEYS="${{ vars.HIGHLIGHT_KEYS }}"
          fi
          python huangli.py

      - name: Upload card artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: huangli-card
          path: card.png
          if-no-files-found: warn
