name: Daily Huangli Push

on:
  schedule:
    # UTC 23:30 = 北京时间 07:30
    - cron: "30 23 * * *"
  workflow_dispatch:

jobs:
  push:
    # macOS runner 自带苹方简体（PingFang SC），与设计稿一致
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and push card
        env:
          WECOM_HOOK: ${{ secrets.WECOM_HOOK }}
          FONT_REGULAR: /System/Library/Fonts/PingFang.ttc
          FONT_BOLD: /System/Library/Fonts/PingFang.ttc
          PYTHONUNBUFFERED: "1"
        run: |
          # 仅当仓库 Variables 配置了 HIGHLIGHT_KEYS 时才注入，避免空字符串覆盖默认「交易」
          if [ -n "${{ vars.HIGHLIGHT_KEYS }}" ]; then
            export HIGHLIGHT_KEYS="${{ vars.HIGHLIGHT_KEYS }}"
          fi
          python huangli.py

      - name: Upload card artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: huangli-card
          path: card.png
          if-no-files-found: warn
