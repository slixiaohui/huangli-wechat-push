name: Daily Huangli Push

on:
  schedule:
    # UTC 22:30 = 北京时间 06:30（中国无夏令时，UTC+8 固定）
    - cron: "30 22 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Push today's huangli
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python main.py
