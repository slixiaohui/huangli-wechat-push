name: Daily Huangli Push

on:
  schedule:
    # UTC 23:30 = 北京时间 07:30
    - cron: "30 23 * * *"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and push card
        env:
          WECOM_HOOK: ${{ secrets.WECOM_HOOK }}
          HIGHLIGHT_KEYS: ${{ vars.HIGHLIGHT_KEYS }}
          PYTHONUNBUFFERED: "1"
        run: python huangli.py

      - name: Upload card artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: huangli-card
          path: card.png
          if-no-files-found: warn
