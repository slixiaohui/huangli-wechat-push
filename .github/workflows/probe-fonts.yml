name: Probe PingFang
on: workflow_dispatch
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Probe
        run: |
          echo "runner=${{ matrix.os }}"
          sw_vers || true
          find /System/Library/Fonts /Library/Fonts -iname '*pingfang*' 2>/dev/null | head
          ls /System/Library/Fonts/PingFang.ttc 2>/dev/null || echo 'no classic PingFang.ttc'
          ls /System/Library/Fonts/Hiragino\ Sans\ GB.ttc 2>/dev/null || true
